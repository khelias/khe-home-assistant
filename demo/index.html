<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- The landing's CSP as nginx sends it, minus what a meta tag cannot carry (frame-ancestors)
     and upgrade-insecure-requests, which would break a local http.server: so a local run
     enforces what khe.ee does. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com">
<title>Kodu · Home Assistanti demo</title>
<meta name="description" content="Väljamõeldud maja Home Assistanti töölaual: 3D-vaade ja simuleeritud seadmed.">
<meta name="theme-color" content="#1c1c1c">
<!-- A mock of a Home Assistant dashboard on the made-up test house: built by
     scripts/house3d-build.py --demo next to the card, the engine and model.json. -->
<style>
/* Home Assistant's default dark theme (frontend color.globals.ts) */
:root {
  color-scheme: dark;
  --primary-background-color: #111111;
  --card-background-color: #1c1c1c;
  --secondary-background-color: #282828;
  --app-header-background-color: #1c1c1c;
  --primary-text-color: #e1e1e1;
  --secondary-text-color: #9b9b9b;
  --divider-color: rgba(225, 225, 225, .12);
  --primary-color: #009ac7;
  --accent-color: #ff9800;
  --state-on-color: #ffc107;
  --state-fan-color: #00bcd4;
  --state-heat-color: #ff6f22;
  --state-cover-color: #926bc7;
  --state-alert-color: #f44336;
  --state-armed-color: #4caf50;
  --state-inactive-color: #9e9e9e;
  --ha-font: Roboto, Noto, system-ui, -apple-system, "Segoe UI", sans-serif;
  --bar-h: 56px;
  --top: calc(var(--bar-h) + 1px + env(safe-area-inset-top, 0px));
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--primary-background-color); color: var(--primary-text-color);
  font: 400 14px/1.43 var(--ha-font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
a { color: var(--primary-color); }
:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }

/* the top app bar: menu, dashboard title, icon-only view tabs */
.toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 4px;
  height: var(--bar-h); padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
  background: var(--app-header-background-color); border-bottom: 1px solid var(--divider-color); }
.icon-button { display: grid; place-items: center; flex: none; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%;
  background: transparent; color: var(--primary-text-color); cursor: pointer; }
.icon-button svg { width: 24px; height: 24px; }
.toolbar .icon-button { margin-left: 4px; }
.main-title { margin: 0 12px 0 4px; font-size: 20px; font-weight: 400; white-space: nowrap; }
.tabs { display: flex; height: 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: grid; place-items: center; flex: none; height: var(--bar-h); padding: 0 16px; box-sizing: border-box;
  color: var(--primary-text-color); opacity: .8; border-bottom: 2px solid transparent; text-decoration: none; }
.tab[aria-selected="true"] { opacity: 1; border-bottom-color: var(--primary-text-color); }
.tab svg { width: 24px; height: 24px; }
@media (hover: hover) and (pointer: fine) {
  .tab:hover, .icon-button:hover { background: rgba(225, 225, 225, .06); }
}

/* the views: each scrolls in its own box under the bar, so the 3D card's top never moves */
.views { position: fixed; top: var(--top); left: 0; right: 0; bottom: 0; }
.view { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
.view.panel { overflow: hidden; }
house3d-card { display: block; --ha-card-border-radius: 0; }
.fallback { display: grid; place-items: center; height: 100%; padding: 16px; box-sizing: border-box; color: var(--secondary-text-color); text-align: center; }

/* sections view: badges, then up to two columns of sections */
.sections { max-width: 1032px; margin: 0 auto; padding: 8px 16px calc(32px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 8px 0 16px; }
.columns { display: grid; grid-template-columns: minmax(0, 500px); justify-content: center; gap: 32px; }
@media (min-width: 720px) { .columns { grid-template-columns: repeat(2, minmax(320px, 500px)); } }
@media (max-width: 600px) { .columns { gap: 8px; } .sections { padding-left: 8px; padding-right: 8px; } }
.section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.heading { display: flex; align-items: center; gap: 8px; min-height: 24px; margin: 16px 4px 0; font-size: 16px; font-weight: 400; line-height: 24px; }
.stack { display: flex; gap: 8px; }
.stack > * { flex: 1 1 0; min-width: 0; }

/* cards: ha-card */
.card { box-sizing: border-box; background: var(--card-background-color); color: var(--primary-text-color);
  border: 1px solid var(--divider-color); border-radius: 12px; }
.badge { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: 18px; cursor: pointer;
  background: var(--card-background-color); border: 1px solid var(--divider-color); }
.badge svg { width: 18px; height: 18px; color: var(--c); }
.b-text { display: flex; flex-direction: column; text-align: left; line-height: 1.15; }
.b-name { font-size: 10px; font-weight: 500; color: var(--secondary-text-color); }
.b-state { font-size: 12px; font-weight: 500; }

.tile { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 112px; padding: 12px 10px 10px; cursor: pointer; }
.t-icon { display: grid; place-items: center; flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%;
  color: var(--c); background: color-mix(in srgb, var(--c) 20%, transparent); transition: background-color .18s, color .18s; }
button.t-icon { cursor: pointer; }
.t-icon svg { width: 20px; height: 20px; }
.t-info { display: grid; gap: 2px; width: 100%; padding: 0; border: 0; background: none; text-align: center; cursor: pointer; }
.t-name { overflow: hidden; font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap; text-overflow: ellipsis; }
.t-state { overflow: hidden; color: var(--secondary-text-color); font-size: 12px; line-height: 16px; white-space: nowrap; text-overflow: ellipsis; }

.c-title { display: block; width: 100%; padding: 0; border: 0; background: none; font-size: 16px; font-weight: 500; text-align: left; cursor: pointer; }
.thermostat { padding: 12px 16px 16px; display: grid; justify-items: center; gap: 8px; }
.thermo { position: relative; width: min(100%, 240px); aspect-ratio: 1; }
.thermo > svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke-linecap: round; stroke-width: 12; }
.thermo .track { stroke: var(--secondary-background-color); }
.thermo .value { stroke: var(--c); transition: d .2s; }
.t-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.t-label { min-height: 20px; color: var(--secondary-text-color); }
.t-big { font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.t-big .unit { font-size: 20px; vertical-align: top; margin-left: 2px; }
.t-now { display: inline-flex; align-items: center; gap: 2px; color: var(--secondary-text-color); font-variant-numeric: tabular-nums; }
.t-now svg { width: 16px; height: 16px; }
.t-steps { display: flex; gap: 24px; margin-top: -56px; position: relative; }
.round { display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--divider-color); background: var(--secondary-background-color); }
.round svg { width: 24px; height: 24px; }
.round:disabled, .modes button:disabled { opacity: .4; cursor: default; }
.modes { display: flex; gap: 8px; width: 100%; max-width: 320px; margin-top: 8px; }
.modes button { flex: 1; height: 40px; border-radius: 12px; border: 1px solid var(--divider-color); background: var(--secondary-background-color); cursor: pointer; }
.modes button[aria-pressed="true"] { background: color-mix(in srgb, var(--state-heat-color) 25%, var(--secondary-background-color)); border-color: var(--state-heat-color); }
.modes button[data-do="mode:off"][aria-pressed="true"] { background: color-mix(in srgb, var(--state-inactive-color) 25%, var(--secondary-background-color)); border-color: var(--state-inactive-color); }

.alarm { padding: 12px 16px 16px; display: grid; gap: 16px; }
.a-state { display: flex; align-items: center; gap: 12px; font-size: 20px; }
.a-state svg { width: 32px; height: 32px; color: var(--c); }
.a-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.a-actions button { flex: 1 1 40%; height: 40px; border-radius: 20px; border: 1px solid var(--divider-color); background: var(--secondary-background-color); cursor: pointer; }

.picture { position: relative; display: block; width: 100%; padding: 0; overflow: hidden; cursor: pointer; text-align: left; }
.p-image { display: grid; place-items: center; aspect-ratio: 16 / 9; color: rgba(225, 225, 225, .25);
  background: repeating-linear-gradient(135deg, rgba(225, 225, 225, .04) 0 12px, transparent 12px 24px), linear-gradient(160deg, #2a3138, #15191d); }
.p-image svg { width: 48px; height: 48px; }
.p-foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 8px;
  padding: 8px 16px; background: rgba(0, 0, 0, .3); }
.p-name { font-size: 16px; } .p-state { font-size: 14px; }
.unknown { padding: 16px; color: var(--secondary-text-color); }

/* the sidebar, as a drawer */
dialog.drawer { box-sizing: border-box; width: min(256px, 85vw); height: 100%; max-width: none; max-height: none; margin: 0 auto 0 0;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  border: 0; border-right: 1px solid var(--divider-color); background: var(--card-background-color); color: var(--primary-text-color); }
dialog.drawer::backdrop { background: rgba(0, 0, 0, .5); }
.d-head { display: flex; align-items: center; gap: 4px; height: var(--bar-h); padding-left: 4px; border-bottom: 1px solid var(--divider-color); }
.d-head span { font-size: 20px; }
.d-nav { padding: 4px 0; }
.d-nav a { display: flex; align-items: center; gap: 24px; height: 40px; margin: 4px 4px; padding: 0 12px; border-radius: 4px;
  color: var(--primary-text-color); text-decoration: none; background: color-mix(in srgb, var(--primary-color) 20%, transparent); }
.d-nav a svg { width: 24px; height: 24px; color: var(--primary-color); }
.d-about { margin: 0; padding: 12px 16px; border-top: 1px solid var(--divider-color); color: var(--secondary-text-color); }
.d-about p { margin: 0 0 12px; }

/* more-info: header with close, then the state and one big control */
dialog.info { box-sizing: border-box; width: 580px; max-width: calc(100% - 32px); max-height: calc(100% - 64px); padding: 0;
  border: 0; border-radius: 24px; background: var(--card-background-color); color: var(--primary-text-color);
  box-shadow: 0 12px 48px rgba(0, 0, 0, .5); }
dialog.info::backdrop { background: rgba(0, 0, 0, .5); }
.handle { display: none; width: 40px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: var(--secondary-text-color); opacity: .5; }
.i-head { display: flex; align-items: center; gap: 4px; padding: 8px 16px 0 4px; }
.i-title { min-width: 0; }
.i-area { margin: 0; color: var(--secondary-text-color); font-size: 14px; line-height: 20px; }
.i-name { margin: 0; overflow: hidden; font-size: 20px; font-weight: 400; line-height: 28px; white-space: nowrap; text-overflow: ellipsis; }
.i-body { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 24px 24px; text-align: center; }
.state { margin: 0; font-size: 36px; line-height: 44px; font-variant-numeric: tabular-nums; }
.when { margin: 0 0 16px; color: var(--secondary-text-color); }
.controls { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
.pill { position: relative; box-sizing: border-box; width: 130px; height: clamp(200px, 40vh, 320px); overflow: hidden; border-radius: 36px;
  background: var(--secondary-background-color); border: 0; padding: 0; touch-action: none; }
.pill.slider { cursor: ns-resize; }
.pill .fill { position: absolute; left: 0; right: 0; bottom: 0; height: var(--v); background: var(--c); transition: height .12s; }
.pill.slider::after { content: ""; position: absolute; left: 50%; bottom: calc(var(--v) - 12px); width: 40px; height: 4px; margin-left: -20px;
  border-radius: 2px; background: rgba(255, 255, 255, .7); }
.pill.switch { cursor: pointer; }
.pill.switch .fill { height: 50%; background: var(--state-inactive-color); opacity: .5; }
.pill.switch[aria-checked="true"] .fill { bottom: 50%; background: var(--c); opacity: 1; }
.pill.buttons, .pill.seg { display: flex; flex-direction: column; }
.pill.buttons button, .pill.seg button { flex: 1; display: grid; place-items: center; padding: 0 8px; border: 0; background: transparent; cursor: pointer; }
.pill.buttons button + button, .pill.seg button + button { border-top: 1px solid var(--divider-color); }
.pill.buttons button svg { width: 28px; height: 28px; }
.pill.buttons button:disabled { opacity: .35; cursor: default; }
.pill.seg button[aria-pressed="true"] { background: var(--c); color: #111; font-weight: 500; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.row button { min-width: 120px; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--divider-color);
  background: var(--secondary-background-color); cursor: pointer; }
.row button:disabled { opacity: .4; cursor: default; }
.note { max-width: 360px; margin: 0; color: var(--secondary-text-color); font-size: 12px; }
.cam { display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; color: var(--secondary-text-color);
  background: repeating-linear-gradient(135deg, rgba(225, 225, 225, .04) 0 12px, transparent 12px 24px), linear-gradient(160deg, #2a3138, #15191d); }
@media (max-width: 870px) {
  dialog.info { width: 100%; max-width: none; max-height: 92%; margin: auto 0 0; border-radius: 20px 20px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  .handle { display: block; }
}
@media (max-width: 600px) { .main-title { display: none; } }
@media (prefers-reduced-motion: reduce) { .t-icon, .thermo .value, .pill .fill { transition: none; } }
</style>
</head>
<body>
<header class="toolbar">
  <button type="button" class="icon-button" data-act="menu" aria-label="Menüü" aria-haspopup="dialog"></button>
  <h1 class="main-title">Kodu</h1>
  <nav class="tabs" role="tablist" aria-label="Vaated"></nav>
</header>
<main class="views"></main>
<dialog class="drawer" aria-label="Külgriba">
  <div class="d-head"><button type="button" class="icon-button" data-act="close" aria-label="Sulge menüü"></button><span>Home Assistant</span></div>
  <nav class="d-nav"><a href="#3d" data-act="close" aria-current="page"><span class="d-icon"></span>Kodu</a></nav>
  <div class="d-about">
    <p>See on väljamõeldud maja Home Assistanti töölaual. Seadmete olekud on simuleeritud ja lähtestuvad, kui lehe uuesti laadid; päris majas tulevad need Home Assistantist.</p>
    <p><a href="https://github.com/khelias/khe-home-assistant">Lähtekood GitHubis</a></p>
  </div>
</dialog>
<dialog class="info" aria-labelledby="info-name">
  <div class="handle" aria-hidden="true"></div>
  <div class="i-head">
    <button type="button" class="icon-button" data-act="close" aria-label="Sulge"></button>
    <div class="i-title"><p class="i-area"></p><h2 class="i-name" id="info-name"></h2></div>
  </div>
  <div class="i-body">
    <p class="state" aria-live="polite"></p>
    <p class="when"></p>
    <div class="controls"></div>
  </div>
</dialog>
<script type="module" src="demo.js?v=__DEMO_VERSION__"></script>
</body>
</html>
