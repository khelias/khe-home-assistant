# Phase 6 price-aware heating and DHW package, on top of sensor.elektri_hinna_prognoos.
# Space heating stays shadow-only (writes nothing to Daikin); its recommendations are kept
# as statistics beside the live offset so the rule can be judged against what the house did.
# DHW target control is opt-in behind input_boolean.boileri_hinnajuhtimine: when on, it writes
# 45-55 C to the tank over LAN, skips off/performance modes and any active anti-legionella
# cycle (target >= 60 C), and restores 55 C when turned off or if prices are missing for 15 min.
#
# Envelope the recommendation keeps, so space heating can later be applied as is:
# - a flat day keeps the base offset: under ~3 c/kWh or 15 % from the day's mean
#   the COP loss of a warmer slab (~2-2.5 % per K) eats the spread;
# - at most 4 reduced hours in a row, then one at base, so a long daytime price
#   plateau does not cool the slab;
# - below -10 C outdoor a reduction is capped at -1 K;
# - the tank target never goes under the 45 C legionella floor.

input_boolean:
  kutte_varjuteavitused:
    name: "Kütte varjuplaani teavitused"
    icon: mdi:bell-outline
  boileri_hinnajuhtimine:
    name: "Boileri hinnajuhtimine"
    icon: mdi:water-boiler-auto

template:
  - triggers:
      - trigger: time_pattern
        minutes: "0"
      - trigger: state
        entity_id:
          - sensor.elektri_hinna_prognoos
          - number.space_heating_temperature_control
          - switch.space_heating_climate_control
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: khe_price_refresh
    actions:
      # One plan for all three sensors, so they never disagree. Rendered as a dict
      # (not to_json): script variables parse the result as a Python literal.
      - variables:
          plan: >
            {%- set all = state_attr('sensor.elektri_hinna_prognoos', 'prices') or [] -%}
            {%- set h_now = ((as_timestamp(now()) // 3600) * 3600) | int -%}
            {%- set d0 = (today_at('00:00') | as_timestamp) | int -%}
            {%- set d1 = ((today_at('00:00') + timedelta(days=1)) | as_timestamp) | int -%}
            {%- set d2 = ((today_at('00:00') + timedelta(days=2)) | as_timestamp) | int -%}
            {%- set heating_on = is_state('switch.space_heating_climate_control', 'on') -%}
            {%- set base = states('number.space_heating_temperature_control') | float(0) | round(0) | int -%}
            {%- set t_out = states('sensor.daikini_valistemperatuur') | float(states('sensor.komfovent_outdoor_temperature') | float(0)) -%}
            {%- set frost = t_out < -10 -%}
            {%- set out = namespace(
              cur_delta=0, cur_reason='andmed puuduvad', cur_price=none, cur_avg=none,
              cur_dhw=55, cur_dhw_mode='tavaline', cur_dhw_win=none, cur_spread=none,
              today_text='Andmed puuduvad', tomorrow_text=none, tomorrow_dhw=none,
              tomorrow_avg=none, tomorrow_spread=none
            ) -%}
            {%- for day_idx in [0, 1] -%}
              {%- set ds = d0 if day_idx == 0 else d1 -%}
              {%- set de = d1 if day_idx == 0 else d2 -%}
              {%- set rows = all | selectattr('s', 'ge', ds) | selectattr('s', 'lt', de) | sort(attribute='s') | list -%}
              {%- if rows | count >= 20 -%}
                {%- set avg = (rows | map(attribute='t') | sum) / (rows | count) -%}
                {%- set mn = (rows | map(attribute='t') | min) -%}
                {%- set mx = (rows | map(attribute='t') | max) -%}
                {%- set spread = mx - mn -%}
                {#- Cheapest contiguous 2 h window for DHW pre-heating -#}
                {%- set dw = namespace(best=none, avg=none) -%}
                {%- for i in range(rows | count - 1) -%}
                  {%- if rows[i + 1].s - rows[i].s == 3600 -%}
                    {%- set a = (rows[i].t + rows[i + 1].t) / 2 -%}
                    {%- if dw.avg is none or a < dw.avg -%}
                      {%- set dw.avg = a -%}
                      {%- set dw.best = rows[i].s -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {#- Walk the day's hours applying spread thresholds, frost guard and max-4h trim cap -#}
                {%- set st = namespace(streak=0, boost=[], trim=[]) -%}
                {%- for r in rows -%}
                  {%- set p = r.t -%}
                  {%- if not heating_on -%}
                    {%- set d = 0 -%}
                    {%- set why = 'küte väljas' -%}
                    {%- set st.streak = 0 -%}
                  {%- else -%}
                    {%- if p <= avg - 0.04 and p <= avg * 0.80 -%}
                      {%- set raw = 2 -%}
                      {%- set why = 'eelküte (odav tund)' -%}
                    {%- elif p <= avg - 0.02 and p <= avg * 0.90 -%}
                      {%- set raw = 1 -%}
                      {%- set why = 'kerge eelküte' -%}
                    {%- elif p >= avg + 0.08 and p >= avg * 1.35 -%}
                      {%- set raw = -3 -%}
                      {%- set why = 'sügav sääst (tipuhind)' -%}
                    {%- elif p >= avg + 0.03 and p >= avg * 1.15 -%}
                      {%- set raw = -2 -%}
                      {%- set why = 'sääst (kallis tund)' -%}
                    {%- else -%}
                      {%- set raw = 0 -%}
                      {%- set why = 'tavaline' -%}
                    {%- endif -%}
                    {%- if raw < 0 -%}
                      {%- if st.streak >= 4 -%}
                        {%- set d = 0 -%}
                        {%- set why = 'taastumistund (4 h piir)' -%}
                        {%- set st.streak = 0 -%}
                      {%- else -%}
                        {%- set d = -1 if frost else raw -%}
                        {%- if frost -%}{%- set why = 'piiratud sääst (pakane)' -%}{%- endif -%}
                        {%- set st.streak = st.streak + 1 -%}
                      {%- endif -%}
                    {%- else -%}
                      {%- set d = raw -%}
                      {%- set st.streak = 0 -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- if d > 0 -%}{%- set st.boost = st.boost + [r.s | timestamp_custom('%H', true)] -%}{%- endif -%}
                  {%- if d < 0 -%}{%- set st.trim = st.trim + [r.s | timestamp_custom('%H', true)] -%}{%- endif -%}
                  {#- DHW hourly target: 55 C in cheapest 2 h window, 45 C on expensive peaks, 52 C otherwise (55 C on flat days) -#}
                  {%- if spread < 0.05 -%}
                    {%- set dhw_t = 55 -%}
                    {%- set dhw_m = 'tavaline' -%}
                  {%- elif dw.best is not none and (r.s == dw.best or r.s == dw.best + 3600) -%}
                    {%- set dhw_t = 55 -%}
                    {%- set dhw_m = 'eelküte' -%}
                  {%- elif p >= avg + 0.04 and p >= avg * 1.20 -%}
                    {%- set dhw_t = 45 -%}
                    {%- set dhw_m = 'ootel' -%}
                  {%- else -%}
                    {%- set dhw_t = 52 -%}
                    {%- set dhw_m = 'tavaline' -%}
                  {%- endif -%}
                  {%- if r.s == h_now -%}
                    {%- set out.cur_delta = d -%}
                    {%- set out.cur_reason = why -%}
                    {%- set out.cur_price = (p * 100) | round(1) -%}
                    {%- set out.cur_avg = (avg * 100) | round(1) -%}
                    {%- set out.cur_dhw = dhw_t -%}
                    {%- set out.cur_dhw_mode = dhw_m -%}
                    {%- set out.cur_spread = (spread * 100) | round(1) -%}
                    {%- if dw.best is not none -%}
                      {%- set out.cur_dhw_win = (dw.best | timestamp_custom('%H:%M', true)) ~ '-' ~ ((dw.best + 7200) | timestamp_custom('%H:%M', true)) ~ ' (' ~ (('%.1f' | format(dw.avg * 100)).replace('.', ',')) ~ ' s/kWh)' -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set summary = ('Küte väljas.' if not heating_on else (
                    ('Eelküte kl ' ~ (st.boost | join(', ')) if st.boost else 'Eelkütet pole') ~
                    '; ' ~
                    ('sääst kl ' ~ (st.trim | join(', ')) if st.trim else 'säästutunde pole') ~ '.'
                  )) -%}
                {%- set dhw_sum = (
                    'Boiler püsib tavalisel 55 °C (hinnavahe ' ~ (('%.1f' | format(spread * 100)).replace('.', ',')) ~ ' s/kWh).'
                    if spread < 0.05 or dw.best is none else
                    'Boileri eelküte ' ~ (dw.best | timestamp_custom('%H:%M', true)) ~ '-' ~ ((dw.best + 7200) | timestamp_custom('%H:%M', true)) ~ ' (' ~ (('%.1f' | format(dw.avg * 100)).replace('.', ',')) ~ ' s/kWh).'
                  ) -%}
                {%- if day_idx == 0 -%}
                  {%- set out.today_text = summary -%}
                {%- else -%}
                  {%- set out.tomorrow_text = summary -%}
                  {%- set out.tomorrow_dhw = dhw_sum -%}
                  {%- set out.tomorrow_avg = (avg * 100) | round(1) -%}
                  {%- set out.tomorrow_spread = (spread * 100) | round(1) -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ {
              'base': base,
              'delta': out.cur_delta,
              'offset': [[base + out.cur_delta, 10] | min, -10] | max,
              'reason': out.cur_reason,
              'price': out.cur_price,
              'avg': out.cur_avg,
              'frost': frost,
              'dhw': out.cur_dhw,
              'dhw_mode': out.cur_dhw_mode,
              'dhw_win': out.cur_dhw_win,
              'spread': out.cur_spread,
              'today_text': out.today_text,
              'tomorrow_text': out.tomorrow_text,
              'tomorrow_dhw': out.tomorrow_dhw,
              'tomorrow_avg': out.tomorrow_avg,
              'tomorrow_spread': out.tomorrow_spread
            } }}
    sensor:
      # No device_class: a curve offset is a temperature difference, not an absolute temperature.
      - name: "Kütte soovitatav nihe"
        unique_id: heating_shadow_recommended_offset
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:chart-bell-curve-cumulative
        availability: "{{ plan.price is not none and has_value('number.space_heating_temperature_control') }}"
        state: "{{ plan.offset }}"
        attributes:
          baasnihe: "{{ plan.base }}"
          muutus: "{{ plan.delta }}"
          pohjus: "{{ plan.reason }}"
          tunni_hind_s: "{{ plan.price }}"
          paeva_keskmine_s: "{{ plan.avg }}"
          pakasepiir: "{{ plan.frost }}"
          tana_plaan: "{{ plan.today_text }}"
          homme_plaan: "{{ plan.tomorrow_text }}"
          homme_boiler: "{{ plan.tomorrow_dhw }}"
          homme_keskmine_s: "{{ plan.tomorrow_avg }}"
          homme_vahe_s: "{{ plan.tomorrow_spread }}"

      - name: "Kütte soovitatav muutus"
        unique_id: heating_shadow_offset_delta
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:delta
        availability: "{{ plan.price is not none }}"
        state: "{{ plan.delta }}"

      - name: "Boileri soovitatav siht"
        unique_id: dhw_shadow_recommended_target
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:water-boiler
        availability: "{{ plan.price is not none }}"
        state: "{{ plan.dhw }}"
        attributes:
          reziim: "{{ plan.dhw_mode }}"
          odavaim_aken: "{{ plan.dhw_win }}"
          paeva_vahe_s: "{{ plan.spread }}"

# When tomorrow's prices land (~14:00): a persistent notification always, a push
# only with the helper on, since the household reads the price digest already.
automation:
  - alias: "Küte: homne varjuplaan"
    id: khe_heating_shadow_tomorrow_plan
    description: "Kirjutab homse kütte- ja boileri varjuplaani püsivasse teavitusse (ja soovi korral push-teavitusena), Daikinile midagi kirjutamata."
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.elektri_hinna_prognoos
        from: "ainult täna"
        to: "täna ja homme"
    actions:
      # the shadow sensors recompute on the same forecast change; let them finish
      # before checking homme_plaan (which enforces >= 20 tomorrow rows)
      - delay: "00:00:10"
      - condition: template
        value_template: "{{ state_attr('sensor.kutte_soovitatav_nihe', 'homme_plaan') is not none }}"
      - variables:
          teade: >
            {%- set keskm = ('%.1f' | format(state_attr('sensor.kutte_soovitatav_nihe', 'homme_keskmine_s') | float(0))).replace('.', ',') -%}
            {%- set vahe = ('%.1f' | format(state_attr('sensor.kutte_soovitatav_nihe', 'homme_vahe_s') | float(0))).replace('.', ',') -%}
            Homne keskmine {{ keskm }} s/kWh (vahe {{ vahe }} s/kWh, varjurežiim ei muuda seadet).
            Põrandaküte (baas {{ '%+d' | format(state_attr('sensor.kutte_soovitatav_nihe', 'baasnihe') | int(0)) }} °C): {{ state_attr('sensor.kutte_soovitatav_nihe', 'homme_plaan') }}
            {{ state_attr('sensor.kutte_soovitatav_nihe', 'homme_boiler') }}
      - action: persistent_notification.create
        data:
          title: "Homne kütte varjuplaan"
          notification_id: kutte_varjuplaan
          message: "{{ teade }}"
      - if:
          - condition: state
            entity_id: input_boolean.kutte_varjuteavitused
            state: "on"
        then:
          - action: notify.notify
            data:
              title: "Homne kütte varjuplaan"
              message: "{{ teade }}"
              data:
                tag: kutte_varjuplaan
                clickAction: /lovelace/soojuspump
                url: /lovelace/soojuspump

  # Opt-in DHW price control (45-55 C): skips off/performance (Kiirsoojendus) and
  # Daikin's weekly 60 C anti-legionella cycle, and writes only when the target changes.
  - alias: "Boiler: hinnajuhtimine"
    id: khe_dhw_price_control
    description: "Seab boileri sihttemperatuuri (45-55 °C) elektrihinna soovituse järgi, kui hinnajuhtimine on sisse lülitatud."
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: sensor.boileri_soovitatav_siht
      - trigger: state
        entity_id: input_boolean.boileri_hinnajuhtimine
        to: "on"
      - trigger: state
        entity_id: water_heater.hot_water_tank_domestic_hot_water_tank
        to: "on"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.boileri_hinnajuhtimine
        state: "on"
      - condition: state
        entity_id: water_heater.hot_water_tank_domestic_hot_water_tank
        state: "on"
      - condition: template
        value_template: >
          {% set rec = states('sensor.boileri_soovitatav_siht') %}
          {% set cur = state_attr('water_heater.hot_water_tank_domestic_hot_water_tank', 'temperature') %}
          {% if not (rec | is_number) or not (cur | is_number) %}
            false
          {% else %}
            {% set cur_f = cur | float(60) %}
            {% set tgt = [[rec | int(55), 55] | min, 45] | max %}
            {{ cur_f < 60 and tgt != (cur_f | round(0) | int) }}
          {% endif %}
    actions:
      - action: water_heater.set_temperature
        target:
          entity_id: water_heater.hot_water_tank_domestic_hot_water_tank
        data:
          temperature: "{{ [[states('sensor.boileri_soovitatav_siht') | int(55), 55] | min, 45] | max }}"

  # Fallback: restore normal 55 C when price control is switched off or prices disappear.
  - alias: "Boiler: taasta 55 °C"
    id: khe_dhw_price_restore
    description: "Taastab boileri tavalise 55 °C sihttemperatuuri, kui hinnajuhtimine lülitatakse välja või hinnaandmed kaovad."
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.boileri_hinnajuhtimine
        from: "on"
        to: "off"
        id: turned_off
      - trigger: state
        entity_id: sensor.boileri_soovitatav_siht
        to:
          - "unavailable"
          - "unknown"
        for: "00:15:00"
        id: missing
    conditions:
      - condition: or
        conditions:
          - condition: trigger
            id: turned_off
          - condition: state
            entity_id: input_boolean.boileri_hinnajuhtimine
            state: "on"
      - condition: state
        entity_id: water_heater.hot_water_tank_domestic_hot_water_tank
        state: "on"
      - condition: template
        value_template: >
          {% set cur = state_attr('water_heater.hot_water_tank_domestic_hot_water_tank', 'temperature') %}
          {{ (cur | is_number) and (cur | float(55)) < 55 }}
    actions:
      - action: water_heater.set_temperature
        target:
          entity_id: water_heater.hot_water_tank_domestic_hot_water_tank
        data:
          temperature: 55
