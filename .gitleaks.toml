title = "khe-home-assistant"

# Every upstream rule stays on; these two cover the one known gap.
[extend]
useDefault = true

# Password hashes. The default ruleset targets API keys and tokens with high
# entropy, not crypt-format hashes, so a committed config file carrying a
# bcrypt hash passes it. Verified both ways on 2026-09-14: default rules report
# "no leaks found" on such a file, these rules flag it.
#
# Plaintext credentials are deliberately NOT covered here - the upstream
# `generic-api-key` rule already catches them, and a second rule for the same
# thing only adds false positives on low-entropy values.

[[rules]]
id = "bcrypt-hash"
description = "bcrypt password hash"
regex = '''\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}'''
tags = ["hash", "password"]

[[rules]]
id = "unix-crypt-hash"
description = "md5-crypt / sha-crypt / apr1 password hash (htpasswd, /etc/shadow)"
regex = '''\$(apr1|1|5|6)\$[./A-Za-z0-9]{1,16}\$[./A-Za-z0-9]{20,}'''
tags = ["hash", "password"]
